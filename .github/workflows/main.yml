name: Workflow-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  train-build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

      - name: Run MLflow project
        run: mlflow run MLproject --env-manager=local

      - name: Get latest run ID
        id: mlflow_run
        run: |
          run_id=$(python -c "import mlflow; runs = mlflow.search_runs(order_by=['start_time DESC']); print(runs.iloc[0].run_id)")
          echo "Run ID: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with MLflow
        run: |
          mlflow models build-docker -m "runs:/${{ steps.mlflow_run.outputs.run_id }}/model" -n submission --env-manager=local
          docker images

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jonathanw47
          password: dckr_pat_LX8cwJvbgTY87y5DbGRvp-B9dTw

      - name: Tag and push image
        run: |
          docker tag submission:latest jonathanw47/submission:latest
          docker push jonathanw47/submission:latest

  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

      - name: Run MLflow project
        run: mlflow run MLproject --env-manager=local
